name: Build VCam

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 1

    # ── Cache Theos ───────────────────────────────────────────────────
    - name: Cache Theos
      id: cache-theos
      uses: actions/cache@v4
      with:
        path: /opt/theos
        key: theos-ios15-git-v5

    # ── Install Theos via git (no API call, no rate limit) ────────────
    - name: Install Theos
      if: steps.cache-theos.outputs.cache-hit != 'true'
      run: |
        set -e

        sudo mkdir -p $THEOS
        sudo chown -R $(id -u):$(id -g) $THEOS

        # FIX: Direct git clone — no GitHub API call, no rate limit
        git clone --depth=1 \
          https://github.com/theos/theos.git $THEOS

        # Init only required submodules — skip optional ones
        cd $THEOS
        git submodule update --init --depth=1 \
          vendor/include \
          vendor/lib \
          vendor/dm.pl \
          vendor/logos

        echo "Theos base installed OK"
        ls $THEOS/

    # ── Install iOS 15 SDK ────────────────────────────────────────────
    - name: Install iOS 15 SDK
      if: steps.cache-theos.outputs.cache-hit != 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        mkdir -p $THEOS/sdks

        # Download iOS 15.0 SDK from theos/sdks releases
        # Using GITHUB_TOKEN avoids rate limit
        SDK_URL=$(curl -fsSL \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/theos/sdks/releases/latest" \
          | python3 -c "import sys,json; r=json.load(sys.stdin); \
            print(next(a['browser_download_url'] for a in r['assets'] \
              if 'iPhoneOS15' in a['name']))")

        echo "SDK URL: $SDK_URL"
        curl -fL "$SDK_URL" -o /tmp/sdk.tar.xz
        tar -xf /tmp/sdk.tar.xz -C $THEOS/sdks/
        rm /tmp/sdk.tar.xz

        echo "SDKs available:"
        ls $THEOS/sdks/

    # ── Build tools ───────────────────────────────────────────────────
    - name: Install build tools
      run: |
        brew install ldid fakeroot 2>/dev/null || true
        echo "$THEOS/bin" >> $GITHUB_PATH

    # ── Build .deb ────────────────────────────────────────────────────
    - name: Build .deb
      env:
        THEOS: /opt/theos
      run: |
        set -e
        export PATH="$THEOS/bin:$PATH"

        echo "=== Build env ==="
        echo "THEOS = $THEOS"
        ls $THEOS/sdks/ || true
        which ldid && ldid || true

        make clean 2>/dev/null || true
        make package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

        echo "=== Packages ==="
        ls -lh packages/

    # ── Upload ────────────────────────────────────────────────────────
    - name: Upload .deb
      uses: actions/upload-artifact@v4
      with:
        name: VCam-rootless-arm64
        path: "packages/*.deb"
        if-no-files-found: error
        retention-days: 30

    # ── Release on tag ────────────────────────────────────────────────
    - name: Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: "packages/*.deb"
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
