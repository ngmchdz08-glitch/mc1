name: Build VCam

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 1

    # ── Cache Theos toolchain ─────────────────────────────────────────
    - name: Cache Theos
      id: cache-theos
      uses: actions/cache@v4
      with:
        path: /opt/theos
        key: theos-ios15-sdk-v3

    # ── Install Theos via official bootstrap (only on cache miss) ─────
    - name: Install Theos
      if: steps.cache-theos.outputs.cache-hit != 'true'
      run: |
        set -e

        # Use official Theos bootstrap (handles submodules properly)
        sudo mkdir -p $THEOS
        sudo chown -R $(id -u):$(id -g) $THEOS

        curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos \
          | bash -s -- --no-confirm

        echo "Theos installed at $THEOS"
        ls $THEOS/

    # ── Install iOS 15 SDK (only on cache miss) ───────────────────────
    - name: Install iOS 15 SDK
      if: steps.cache-theos.outputs.cache-hit != 'true'
      run: |
        set -e

        SDK_URL="https://github.com/theos/sdks/releases/latest/download/iPhoneOS15.0.sdk.tar.xz"
        echo "Downloading iOS 15.0 SDK..."
        curl -sL "$SDK_URL" -o /tmp/sdk.tar.xz
        tar -xf /tmp/sdk.tar.xz -C $THEOS/sdks/
        rm /tmp/sdk.tar.xz

        echo "SDKs available:"
        ls $THEOS/sdks/

    # ── Build tools ───────────────────────────────────────────────────
    - name: Install build tools
      run: |
        # ldid for signing, fakeroot for deb packaging
        brew install ldid fakeroot 2>/dev/null || true
        # Make sure Theos bin is in PATH
        echo "$THEOS/bin" >> $GITHUB_PATH

    # ── Build .deb ────────────────────────────────────────────────────
    - name: Build .deb
      run: |
        set -e
        export PATH="$THEOS/bin:$PATH"

        echo "=== Build environment ==="
        echo "THEOS=$THEOS"
        echo "ARCHS=arm64"
        echo "Target: iOS 15 rootless"
        which ldid || echo "WARNING: ldid not found"

        # Build — Makefile already sets TARGET=iphone:clang:15.0:15.0
        # and THEOS_PACKAGE_SCHEME=rootless, so we just add FINALPACKAGE
        make clean 2>/dev/null || true
        make package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu) 2>&1

        echo "=== Packages built ==="
        ls -lh packages/ 2>/dev/null || echo "No packages/ folder — check build output above"

    # ── Upload artifact ───────────────────────────────────────────────
    - name: Upload .deb
      uses: actions/upload-artifact@v4
      with:
        name: VCam-rootless-arm64
        path: "packages/*.deb"
        if-no-files-found: error
        retention-days: 30

    # ── Auto release on git tag push ──────────────────────────────────
    - name: Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: "packages/*.deb"
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
